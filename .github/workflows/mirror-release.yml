name: Mirror release

# Copies one version's installers from the repository of the program to the Releases of this
# one, after checking them against SHA256SUMS.txt. It runs when the version written in
# .github/mirror-version changes, or by hand.
#
# It only reaches the other repository while that one is public. Once the code is private,
# the build there publishes here by itself (its RELEASES_TOKEN secret) and this is not needed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to mirror, like 1.0.0
        required: true
  push:
    branches: [main]
    paths: ['.github/mirror-version']

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Copy the installers and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.version }}
        run: |
          version="${ASKED:-$(tr -d '[:space:]' < .github/mirror-version)}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version: '$version'"; exit 1 ;;
          esac
          source="CultoemOff/Church-Lower-Thirds"
          tag="v$version"
          mkdir out
          gh release download "$tag" --repo "$source" --dir out \
            --pattern 'Church-Lower-Thirds-Setup-*.exe' --pattern 'Church-Lower-Thirds-macOS-*.pkg' --pattern 'SHA256SUMS.txt'
          ls -la out
          # Nothing is published unless both installers are exactly what the list says.
          (cd out && sha256sum -c SHA256SUMS.txt)
          [ "$(ls out | wc -l)" -eq 3 ]
          gh release view "$tag" --repo "$source" --json body --jq .body > notes.md
          flags=()
          title="Church Lower Thirds v$version"
          case "$version" in *-*) flags+=(--prerelease); title="$title (beta)" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "${flags[@]}"
          fi
          gh release upload "$tag" out/* --clobber
          gh release view "$tag" --json tagName,isPrerelease,assets --jq '{tagName, isPrerelease, assets: [.assets[].name]}'
